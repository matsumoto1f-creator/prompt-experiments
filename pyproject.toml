[project]
name = "prompt-experiments"
version = "0.1.0"
description = "Prompt versioning and A/B testing that refuses to declare a winner from a peeked p-value."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=1.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
prompt-exp = "prompt_experiments.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
